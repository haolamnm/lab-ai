<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" font-family="IBM Plex Sans, system-ui, sans-serif">
  <style>
    .lbl   { font-size: 11px; fill: #857d6e; }
    .lblm  { font-size: 10px; fill: #857d6e; font-family: 'IBM Plex Mono', ui-monospace, monospace; letter-spacing: .1em; }
    .txt   { font-size: 11.5px; fill: #23201b; }
    .mono  { font-size: 11px; fill: #23201b; font-family: 'IBM Plex Mono', ui-monospace, monospace; }
    .head  { font-size: 12px; fill: #23201b; font-weight: 600; }
    .note  { font-size: 11px; fill: #6b6355; font-style: italic; }
    .rule  { stroke: #e0d8c8; stroke-width: 1; fill: none; }
    .paper { fill: #fbf8f2; }
    .page  { fill: #f0eadd; }
  </style>

  <rect width="1180" height="700" fill="#f0eadd"/>

  <!-- ============ app frame ============ -->
  <g transform="translate(24,24)">
    <rect x="0" y="0" width="880" height="600" rx="6" class="paper" stroke="#d8cfbc"/>

    <!-- topbar -->
    <rect x="0" y="0" width="880" height="38" rx="6" class="paper"/>
    <rect x="0" y="30" width="880" height="8" class="paper"/>
    <line x1="0" y1="38" x2="880" y2="38" class="rule"/>
    <text x="16" y="24" class="head">Route Lab <tspan fill="#857d6e" font-weight="400" font-family="IBM Plex Mono, monospace">· delivery HCMC</tspan></text>
    <g transform="translate(560,19)">
      <circle cx="0" cy="-3" r="4" fill="#9db4f0"/><text x="9" y="1" class="lbl">expanded</text>
      <circle cx="86" cy="-3" r="4" fill="#23201b"/><text x="95" y="1" class="lbl">route</text>
      <rect x="150" y="-10" width="72" height="15" rx="3" fill="none" stroke="#e0d8c8"/>
      <text x="157" y="1" class="lbl">synced view</text>
    </g>

    <!-- sidebar -->
    <rect x="0" y="38" width="236" height="562" fill="#fbf8f2"/>
    <line x1="236" y1="38" x2="236" y2="600" class="rule"/>

    <g transform="translate(16,0)">
      <text x="0" y="66" class="lblm">TRIP</text>
      <rect x="0" y="74" width="204" height="26" rx="3" fill="#fbf8f2" stroke="#e0d8c8"/>
      <text x="9" y="91" class="lblm" fill="#a49a88">PICK</text>
      <text x="46" y="91" class="txt">Chợ Bến Thành</text>
      <rect x="0" y="105" width="204" height="26" rx="3" fill="#fbf8f2" stroke="#e0d8c8"/>
      <text x="9" y="122" class="lblm" fill="#a49a88">DROP</text>
      <text x="46" y="122" class="txt">Landmark 81</text>
      <text x="0" y="147" class="lbl" text-decoration="underline">+ Add a stop</text>

      <line x1="-16" y1="162" x2="220" y2="162" stroke="#ebe4d6"/>
      <text x="0" y="184" class="lblm">ROAD NETWORK</text>
      <g>
        <rect x="0" y="192" width="51" height="24" rx="3" fill="#23201b"/>
        <text x="10" y="208" class="lbl" fill="#fbf8f2">Main</text>
        <rect x="51" y="192" width="51" height="24" fill="none" stroke="#e0d8c8"/>
        <text x="61" y="208" class="lbl">Med</text>
        <rect x="102" y="192" width="51" height="24" fill="none" stroke="#e0d8c8"/>
        <text x="114" y="208" class="lbl">Minor</text>
        <rect x="153" y="192" width="51" height="24" rx="3" fill="none" stroke="#e0d8c8"/>
        <text x="163" y="208" class="lbl">Alleys</text>
      </g>
      <rect x="0" y="222" width="204" height="26" rx="3" fill="none" stroke="#e0d8c8"/>
      <text x="60" y="239" class="txt">Rebuild network</text>
      <text x="0" y="262" class="lbl">483 nodes · 1 204 segments</text>

      <line x1="-16" y1="276" x2="220" y2="276" stroke="#ebe4d6"/>
      <text x="0" y="298" class="lblm">CONDITIONS</text>
      <g>
        <rect x="0" y="306" width="68" height="24" rx="3" fill="#e85d5d" opacity=".14" stroke="#e85d5d"/>
        <text x="18" y="322" class="lbl" fill="#23201b">Peak</text>
        <rect x="68" y="306" width="68" height="24" fill="none" stroke="#e0d8c8"/>
        <text x="80" y="322" class="lbl">Off-peak</text>
        <rect x="136" y="306" width="68" height="24" rx="3" fill="none" stroke="#e0d8c8"/>
        <text x="155" y="322" class="lbl">Night</text>
      </g>
      <g>
        <rect x="0" y="336" width="51" height="24" rx="3" fill="#23201b"/>
        <text x="4" y="352" class="lbl" fill="#fbf8f2">Motorbike</text>
        <rect x="51" y="336" width="51" height="24" fill="none" stroke="#e0d8c8"/>
        <text x="66" y="352" class="lbl">Van</text>
        <rect x="102" y="336" width="51" height="24" fill="none" stroke="#e0d8c8"/>
        <text x="119" y="352" class="lbl">Car</text>
        <rect x="153" y="336" width="51" height="24" rx="3" fill="none" stroke="#e0d8c8"/>
        <text x="167" y="352" class="lbl">Truck</text>
      </g>

      <line x1="-16" y1="376" x2="220" y2="376" stroke="#ebe4d6"/>
      <text x="0" y="398" class="lblm">COST WEIGHTS</text>
      <g transform="translate(0,408)">
        <text x="0" y="8" class="lbl">Distance</text><text x="188" y="8" class="mono">1.0</text>
        <rect x="0" y="13" width="204" height="3" rx="1.5" fill="#ddd5c5"/>
        <rect x="0" y="13" width="128" height="3" rx="1.5" fill="#0a736f"/>
        <text x="0" y="34" class="lbl">Time</text><text x="188" y="34" class="mono">0.5</text>
        <rect x="0" y="39" width="204" height="3" rx="1.5" fill="#ddd5c5"/>
        <rect x="0" y="39" width="64" height="3" rx="1.5" fill="#1e5fa8"/>
        <text x="0" y="60" class="lbl">Congestion</text><text x="188" y="60" class="mono">0.8</text>
        <rect x="0" y="65" width="204" height="3" rx="1.5" fill="#ddd5c5"/>
        <rect x="0" y="65" width="102" height="3" rx="1.5" fill="#e8760a"/>
        <text x="0" y="86" class="lbl">Risk</text><text x="188" y="86" class="mono">1.5</text>
        <rect x="0" y="91" width="204" height="3" rx="1.5" fill="#ddd5c5"/>
        <rect x="0" y="91" width="180" height="3" rx="1.5" fill="#d4342c"/>
      </g>

      <rect x="0" y="530" width="204" height="30" rx="3" fill="#23201b"/>
      <text x="58" y="550" class="txt" fill="#fbf8f2">Run algorithms</text>
    </g>

    <!-- ===== pane grid ===== -->
    <rect x="237" y="38" width="643" height="524" class="page"/>

    <!-- pane: A* -->
    <g transform="translate(253,54)">
      <rect width="304" height="196" rx="4" class="paper" stroke="#e0d8c8"/>
      <line x1="0" y1="26" x2="304" y2="26" class="rule"/>
      <circle cx="13" cy="13" r="3.5" fill="#0a736f"/>
      <text x="24" y="17" class="head">A*</text>
      <text x="232" y="17" class="lbl">step 128</text>
      <rect x="1" y="27" width="302" height="144" fill="#fbf8f2"/>
      <g opacity=".5" stroke="#cfc6b4" fill="none">
        <path d="M20 150 L70 120 L130 130 L190 96 L250 70"/><path d="M40 40 L90 76 L130 130"/>
        <path d="M250 70 L280 120"/><path d="M70 120 L60 60"/><path d="M190 96 L210 140"/>
      </g>
      <g fill="#9db4f0" opacity=".85">
        <circle cx="70" cy="120" r="4"/><circle cx="130" cy="130" r="4"/><circle cx="90" cy="76" r="3.4"/>
        <circle cx="190" cy="96" r="4"/><circle cx="60" cy="60" r="3"/><circle cx="210" cy="140" r="3"/>
      </g>
      <path d="M20 150 L70 120 L130 130 L190 96 L250 70" stroke="#23201b" stroke-width="2.4" fill="none" stroke-linejoin="round"/>
      <circle cx="20" cy="150" r="4.5" fill="#23201b"/><circle cx="250" cy="70" r="4.5" fill="#23201b"/>
      <line x1="0" y1="171" x2="304" y2="171" class="rule"/>
      <text x="10" y="187" class="lbl"><tspan class="mono" fill="#23201b">11.4</tspan> km · <tspan class="mono" fill="#23201b">31</tspan> min · <tspan class="mono" fill="#23201b">197</tspan> expanded</text>
      <text x="252" y="187" class="lbl">OPTIMAL</text>
    </g>

    <!-- pane: UCS -->
    <g transform="translate(573,54)">
      <rect width="291" height="196" rx="4" class="paper" stroke="#e0d8c8"/>
      <line x1="0" y1="26" x2="291" y2="26" class="rule"/>
      <circle cx="13" cy="13" r="3.5" fill="#1e5fa8"/>
      <text x="24" y="17" class="head">UCS</text>
      <text x="219" y="17" class="lbl">step 128</text>
      <rect x="1" y="27" width="289" height="144" fill="#fbf8f2"/>
      <g opacity=".5" stroke="#cfc6b4" fill="none">
        <path d="M20 150 L70 120 L130 130 L185 96 L240 70"/><path d="M40 40 L90 76 L130 130"/>
        <path d="M240 70 L268 120"/><path d="M70 120 L60 60"/><path d="M185 96 L205 140"/>
      </g>
      <g fill="#9db4f0">
        <circle cx="70" cy="120" r="4.5"/><circle cx="130" cy="130" r="4.5"/><circle cx="90" cy="76" r="4.5"/>
        <circle cx="185" cy="96" r="4.5"/><circle cx="60" cy="60" r="4.5"/><circle cx="205" cy="140" r="4.5"/>
        <circle cx="40" cy="40" r="4.5"/><circle cx="268" cy="120" r="4.5"/><circle cx="110" cy="55" r="4.5"/>
        <circle cx="45" cy="95" r="4.5"/><circle cx="150" cy="75" r="4.5"/><circle cx="230" cy="115" r="4.5"/>
      </g>
      <path d="M20 150 L70 120 L130 130 L185 96 L240 70" stroke="#23201b" stroke-width="2.4" fill="none" stroke-linejoin="round"/>
      <circle cx="20" cy="150" r="4.5" fill="#23201b"/><circle cx="240" cy="70" r="4.5" fill="#23201b"/>
      <line x1="0" y1="171" x2="291" y2="171" class="rule"/>
      <text x="10" y="187" class="lbl"><tspan class="mono" fill="#23201b">11.4</tspan> km · <tspan class="mono" fill="#23201b">31</tspan> min · <tspan class="mono" fill="#23201b">263</tspan> expanded</text>
      <text x="239" y="187" class="lbl">OPTIMAL</text>
    </g>

    <!-- pane: BFS -->
    <g transform="translate(253,266)">
      <rect width="304" height="196" rx="4" class="paper" stroke="#e0d8c8"/>
      <line x1="0" y1="26" x2="304" y2="26" class="rule"/>
      <circle cx="13" cy="13" r="3.5" fill="#b0651c"/>
      <text x="24" y="17" class="head">BFS</text>
      <text x="232" y="17" class="lbl">step 128</text>
      <rect x="1" y="27" width="302" height="144" fill="#fbf8f2"/>
      <g opacity=".5" stroke="#cfc6b4" fill="none">
        <path d="M20 150 L70 120 L130 130 L190 96 L250 70"/><path d="M40 40 L90 76 L130 130"/>
      </g>
      <g fill="#9db4f0">
        <circle cx="70" cy="120" r="5"/><circle cx="130" cy="130" r="5"/><circle cx="90" cy="76" r="5"/>
        <circle cx="60" cy="60" r="5"/><circle cx="40" cy="40" r="5"/><circle cx="45" cy="95" r="5"/>
        <circle cx="110" cy="55" r="5"/><circle cx="150" cy="75" r="5"/><circle cx="105" cy="160" r="5"/>
        <circle cx="35" cy="130" r="5"/><circle cx="165" cy="140" r="5"/><circle cx="80" cy="40" r="5"/>
        <circle cx="140" cy="40" r="5"/><circle cx="20" cy="70" r="5"/><circle cx="175" cy="60" r="5"/>
      </g>
      <path d="M20 150 L70 120 L130 130 L190 96 L250 70" stroke="#23201b" stroke-width="2.4" fill="none" stroke-linejoin="round" opacity=".25"/>
      <circle cx="20" cy="150" r="4.5" fill="#23201b"/>
      <line x1="0" y1="171" x2="304" y2="171" class="rule"/>
      <text x="10" y="187" class="lbl">running · <tspan class="mono" fill="#23201b">128</tspan>/<tspan class="mono" fill="#23201b">311</tspan> expanded</text>
    </g>

    <!-- pane: Greedy, tree view -->
    <g transform="translate(573,266)">
      <rect width="291" height="196" rx="4" class="paper" stroke="#e0d8c8"/>
      <line x1="0" y1="26" x2="291" y2="26" class="rule"/>
      <circle cx="13" cy="13" r="3.5" fill="#6d4aa8"/>
      <text x="24" y="17" class="head">Greedy</text>
      <g>
        <rect x="150" y="4" width="43" height="18" rx="2" fill="none" stroke="#e0d8c8"/>
        <text x="160" y="17" class="lbl">map</text>
        <rect x="193" y="4" width="43" height="18" fill="none" stroke="#e0d8c8"/>
        <text x="197" y="17" class="lbl">schem</text>
        <rect x="236" y="4" width="43" height="18" rx="2" fill="#23201b"/>
        <text x="249" y="17" class="lbl" fill="#fbf8f2">tree</text>
      </g>
      <rect x="1" y="27" width="289" height="144" fill="#fbf8f2"/>
      <g stroke="#c3b9a4" fill="none" stroke-width="1">
        <path d="M145 62 L120 88 M145 62 L170 88 M145 62 L145 92"/>
        <path d="M120 88 L104 118 M120 88 L134 118"/>
        <path d="M170 88 L186 118 M145 92 L145 122"/>
        <path d="M104 118 L96 146 M186 118 L196 146"/>
      </g>
      <g fill="#6d4aa8">
        <circle cx="145" cy="62" r="4"/><circle cx="120" cy="88" r="3.4"/><circle cx="170" cy="88" r="3.4"/>
        <circle cx="145" cy="92" r="3.4"/><circle cx="104" cy="118" r="3"/><circle cx="134" cy="118" r="3"/>
        <circle cx="186" cy="118" r="3"/><circle cx="145" cy="122" r="3"/><circle cx="96" cy="146" r="2.6"/>
        <circle cx="196" cy="146" r="2.6"/>
      </g>
      <line x1="0" y1="171" x2="291" y2="171" class="rule"/>
      <text x="10" y="187" class="lbl">done at step <tspan class="mono" fill="#23201b">79</tspan> · <tspan class="mono" fill="#23201b">13.1</tspan> km · approximate</text>
    </g>

    <!-- add pane -->
    <g transform="translate(253,478)">
      <rect width="120" height="68" rx="4" fill="none" stroke="#cfc6b4" stroke-dasharray="4 3"/>
      <text x="28" y="38" class="lbl">+ Add pane</text>
    </g>

    <!-- timeline -->
    <line x1="237" y1="562" x2="880" y2="562" class="rule"/>
    <g transform="translate(253,562)">
      <text x="4" y="24" class="txt">◀</text>
      <rect x="26" y="8" width="52" height="22" rx="3" fill="#23201b"/>
      <text x="38" y="24" class="lbl" fill="#fbf8f2">Pause</text>
      <text x="90" y="24" class="txt">▶</text>
      <text x="118" y="24" class="lbl">Step <tspan class="mono" fill="#23201b">128</tspan>/<tspan class="mono" fill="#23201b">311</tspan></text>
      <rect x="228" y="17" width="290" height="4" rx="2" fill="#ddd5c5"/>
      <rect x="228" y="17" width="119" height="4" rx="2" fill="#23201b"/>
      <circle cx="347" cy="19" r="6" fill="#23201b"/>
      <text x="540" y="24" class="mono">1×</text>
    </g>
  </g>

  <!-- ============ callouts ============ -->
  <g stroke="#a89e8b" stroke-width="1" fill="none">
    <path d="M148 300 L940 300" stroke-dasharray="3 3"/>
    <path d="M470 118 L940 118" stroke-dasharray="3 3"/>
    <path d="M700 380 L940 380" stroke-dasharray="3 3"/>
    <path d="M700 604 L940 604" stroke-dasharray="3 3"/>
  </g>
  <g>
    <text x="948" y="112" class="head">One pane per algorithm</text>
    <text x="948" y="130" class="lbl">Map, schematic or search-tree view.</text>
    <text x="948" y="145" class="lbl">Drag the header to reorder.</text>

    <text x="948" y="294" class="head">One source of truth</text>
    <text x="948" y="312" class="lbl">Every pane provably ran on the</text>
    <text x="948" y="327" class="lbl">same input. Changing anything</text>
    <text x="948" y="342" class="lbl">here clears all results at once.</text>

    <text x="948" y="374" class="head">Same route, different work</text>
    <text x="948" y="392" class="lbl">A* and UCS return the identical</text>
    <text x="948" y="407" class="lbl">route — 197 nodes versus 263.</text>
    <text x="948" y="422" class="note">That gap is the whole point.</text>

    <text x="948" y="598" class="head">One shared timeline</text>
    <text x="948" y="616" class="lbl">Step 128 means step 128 in</text>
    <text x="948" y="631" class="lbl">every pane, simultaneously.</text>
  </g>

  <text x="24" y="664" class="lblm">ROUTE LAB — UI OVERVIEW</text>
  <text x="24" y="684" class="lbl">Schematic of the running application. Colour appears only where it carries meaning: congestion, expanded region, chosen route, per-algorithm hue.</text>
</svg>
