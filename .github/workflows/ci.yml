name: CI

# CONVENTIONS.md §8 names two gates: `bunx tsc --noEmit` plus `bun run build`
# for web/, and `make check` for server/. The two jobs below run exactly those,
# so the rule is enforced rather than merely written down. Keep them in step:
# the server job spells out the same steps `server/Makefile`'s `check` target
# runs, in the same order, so a red build here reproduces locally.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile fails rather than silently rewriting bun.lock, so a
      # dependency that drifted from the lockfile shows up here instead of on
      # someone's machine a week later.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

  # Mirrors `make check` in server/: the same gate a contributor runs locally
  # before a commit, so a red build here is reproducible on their machine
  # rather than being a CI-only surprise.
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --frozen fails rather than silently rewriting uv.lock, matching the
      # frontend's --frozen-lockfile install above.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Typecheck (ty)
        run: uv run ty check

      - name: Typecheck (basedpyright)
        run: uv run basedpyright

      - name: Check import layering
        run: uv run lint-imports

      - name: Check dependencies
        run: uv run deptry src

      - name: Test
        run: uv run pytest
